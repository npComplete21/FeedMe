# Redis: Celery's broker (job queue) and result backend.
#
# Deliberately no PersistentVolumeClaim, matching docker-compose.yml. Everything
# here is derived state - queued jobs and task results - so losing it on a
# restart costs at most an in-flight ingestion. "Was my recipe saved?" is always
# answered by Postgres, never by Redis.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      securityContext:
        runAsUser: 999          # the redis user in the official image
        runAsGroup: 1000
      containers:
        - name: redis
          image: redis:7-alpine
          # Without a cap Redis grows until the node runs out of memory, and the
          # default `noeviction` policy makes it start REFUSING WRITES rather
          # than shedding data - which surfaces as ingestion silently failing.
          # 200Mi is far above anything this queue needs (task payloads are a URL
          # and a caption); allkeys-lru means a runaway backlog degrades instead
          # of breaking. The container limit is 256Mi, so Redis evicts before the
          # kernel OOM-kills it.
          args:
            - redis-server
            - --maxmemory
            - 200mb
            - --maxmemory-policy
            - allkeys-lru
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  type: ClusterIP             # internal only - as with db, the Compose
                              # `ports: "6379:6379"` is not carried over
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
