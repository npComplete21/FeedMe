# The only route into the cluster from the internet.
#
# Deliberately exposes the UI and NOT the API. Streamlit renders server-side:
# the browser only ever talks to the ui pod, which calls the api over the
# cluster-internal Service (FEEDME_API_URL=http://api:8000). So the API needs no
# public route for the app to work, and not having one is less surface. Adding
# one later is a second rule pointing /api at svc/api port 8000 - worth doing if
# you ever want to curl the API directly.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: feedme
  annotations:
    # Staging proved the flow (cert issued with both SANs) before this was
    # pointed at production, so no failed validations were spent against
    # prod's 5-per-hostname-per-hour limit while DNS was still propagating.
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # <namespace>-<middleware-name>@kubernetescrd is Traefik's required
    # naming for a Middleware defined as a CRD.
    traefik.ingress.kubernetes.io/router.middlewares: feedme-redirect-https@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - feedmepls.xyz
        - www.feedmepls.xyz
      secretName: feedme-tls      # cert-manager creates and renews this
  rules:
    - host: feedmepls.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ui
                port:
                  number: 8501
    - host: www.feedmepls.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ui
                port:
                  number: 8501
