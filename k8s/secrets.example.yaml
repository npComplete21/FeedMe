# Template only - documents which keys the manifests expect. Do NOT put real
# values in this file; it is committed. The real Secret is created directly
# against the cluster and never lands in git (k8s/secrets.yaml is gitignored if
# you prefer the file route).
#
# Preferred - create it imperatively, so the values never touch a file:
#
#   kubectl create secret generic feedme-secrets \
#     --from-literal=DATABASE_URL='postgresql+psycopg://feedme:REAL_PW@db:5432/feedme' \
#     --from-literal=POSTGRES_PASSWORD='REAL_PW' \
#     --from-literal=ANTHROPIC_API_KEY='sk-ant-...' \
#     --from-literal=JWT_SECRET_KEY="$(python -c 'import secrets; print(secrets.token_hex(32))')" \
#     --from-literal=FEEDME_REGISTRATION_CODE="$(python -c 'import secrets; print(secrets.token_hex(16))')"
#
# Note POSTGRES_PASSWORD and the password inside DATABASE_URL must match - the
# db pod reads the former, api/worker read the latter.
#
# Caveat worth knowing: Kubernetes Secrets are base64-encoded, NOT encrypted at
# rest by default. Fine for this project; don't assume otherwise.
apiVersion: v1
kind: Secret
metadata:
  name: feedme-secrets
type: Opaque
stringData:
  DATABASE_URL: postgresql+psycopg://feedme:CHANGEME@db:5432/feedme
  POSTGRES_PASSWORD: CHANGEME
  ANTHROPIC_API_KEY: CHANGEME
  JWT_SECRET_KEY: CHANGEME
  FEEDME_REGISTRATION_CODE: CHANGEME
