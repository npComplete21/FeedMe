# Lets the whole stack go up with `kubectl apply -k k8s/` instead of five
# separate -f flags, and gives 3.8's CI/CD a single place to rewrite image tags
# (`kustomize edit set image feedme-api=...:$GIT_SHA`) rather than sed-ing YAML.
#
# secrets.example.yaml is deliberately NOT listed - the real Secret is created
# against the cluster directly, not applied from this directory.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: feedme

resources:
  - namespace.yaml
  - db.yaml
  - redis.yaml
  - api.yaml
  - worker.yaml
  - ui.yaml
  - networkpolicy.yaml
  - redirect-middleware.yaml
  - ingress.yaml
  - backup.yaml

# Applied to every object above, so `kubectl get all -l app.kubernetes.io/part-of=feedme`
# finds the whole stack and nothing else on the node. includeSelectors:false
# deliberately - baking an extra label into a Deployment's selector makes it
# immutable and awkward to change later; the app: <name> selectors are enough.
labels:
  - pairs:
      app.kubernetes.io/part-of: feedme
    includeSelectors: false

# Image substitution lives here rather than in the Deployments, so CI changes
# exactly one place. The manifests refer to the short symbolic names below;
# `kustomize edit set image feedme-api=<registry>/<name>:<sha>` rewrites them at
# deploy time (.github/workflows/deploy.yml).
#
# newTag is `latest` only as a local-development fallback - every real deploy
# overrides it with an immutable per-commit tag, which is what makes
# `kubectl rollout undo` and `rollout status` meaningful. ADR-0018 flagged the
# original :latest tags as temporary; this is where they retire.
images:
  - name: feedme-api
    newName: ghcr.io/npcomplete21/feedme-api
    newTag: latest
  - name: feedme-worker
    newName: ghcr.io/npcomplete21/feedme-worker
    newTag: latest
  - name: feedme-ui
    newName: ghcr.io/npcomplete21/feedme-ui
    newTag: latest
