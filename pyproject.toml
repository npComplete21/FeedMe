[project]
name = "feedme"
version = "0.1.0"
description = "Recipe collector + ingredient-based recipe finder"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Split so each Docker image installs only what it needs (api image never
# pulls in streamlit; ui image never pulls in sqlalchemy/anthropic/yt-dlp) -
# see ADR-0012. Local dev installs both: pip install -e ".[api,ui,dev]"
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "yt-dlp>=2024.8.6",
    # Challenge-solver scripts for YouTube's "n" challenge. Useless without a
    # JavaScript runtime, which docker/worker.Dockerfile supplies - see ADR-0024.
    "yt-dlp-ejs>=0.8",
    "anthropic>=0.40",
    "celery>=5.4",
    "redis>=5.0",
    "bcrypt>=4.1",
    "pyjwt>=2.9",
]
ui = [
    # st.feedback(default=...) for star ratings needs a recent release, and the
    # mobile-first UI (ADR-0032) uses horizontal st.container(key=...), st.navigation
    # position="hidden" and st.context.theme; it was built and verified on 1.59.2.
    # Upper-pinned to the tested range: the tab bar's CSS targets Streamlit
    # internals that AppTest can't see, so bumping this needs the live
    # phone-width check from ADR-0032 (bar, Ask input, recipe rows) first.
    "streamlit>=1.59.2,<1.60",
    "httpx>=0.27",
]
dev = [
    "pytest>=8.3",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: hits real external services (network, real API calls); run explicitly with `pytest -m integration`",
]
