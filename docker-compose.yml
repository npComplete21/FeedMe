services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: feedme
      POSTGRES_PASSWORD: feedme
      POSTGRES_DB: feedme
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U feedme"]
      interval: 2s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file: .env
    environment:
      # Overrides .env's localhost values - inside the Compose network, `db`
      # and `redis` are service hostnames, not localhost.
      DATABASE_URL: postgresql+psycopg://feedme:feedme@db:5432/feedme
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://feedme:feedme@db:5432/feedme
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  ui:
    build:
      context: .
      dockerfile: docker/ui.Dockerfile
    environment:
      # Same reasoning - reach the API by its Compose service name, not localhost.
      FEEDME_API_URL: http://api:8000
      # Pulled from the top-level .env via Compose variable substitution rather
      # than `env_file: .env` (which api/worker use) - the UI has no use for
      # ANTHROPIC_API_KEY, so it shouldn't be sitting in this container's env
      # just because it's in the file (see ADR-0014).
      FEEDME_API_TOKEN: ${FEEDME_API_TOKEN}
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  pgdata:
